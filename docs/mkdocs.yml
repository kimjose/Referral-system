site_name: Angaza Referral System Documentation
site_description: Comprehensive documentation for the Angaza Referral System
site_author: Angaza Development Team
repo_url: https://github.com/yourusername/angaza-referral
repo_name: Angaza Referral

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - pymdownx.arithmatex
  - pymdownx.emoji
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.tasklist
  - pymdownx.smartsymbols
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search
  - git-revision-date-localized
  - minify:
      minify_html: true

docs_dir: new_docs

nav:
  - Home: index.md
  - User Documentation:
    - Getting Started: guides/getting-started.md
    - User Guide: guides/user-manual.md
    - Features: guides/features.md
    - Troubleshooting: guides/troubleshooting.md
  - Technical Documentation:
    - Architecture:
      - System Overview: architecture/system-overview.md
      - System Diagrams: architecture/system-diagrams.md
      - Class Diagram: architecture/class-diagram.md
      - Sequence Diagram: architecture/sequence-diagram.md
    - Development:
      - Setup: development/setup.md
      - Database: development/database.md
      - Views: development/views.md
      - Testing: development/testing.md
      - Migrations: development/migrations.md
      - Contributing: development/contributing.md
    - Standards:
      - Health Data Standards: standards/health-standards.md
    - API:
      - API Documentation: api/api-documentation.md
  - Project:
    - Changelog: changelog.md 